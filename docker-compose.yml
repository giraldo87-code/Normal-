version: '3.9'

services:
  # Base de datos PostgreSQL con TimescaleDB para series de tiempo
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: monitor_postgres
    environment:
      POSTGRES_USER: monitor_user
      POSTGRES_PASSWORD: monitor_secure_pass
      POSTGRES_DB: monitor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitor_network

  # API Backend con FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monitor_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://monitor_user:monitor_secure_pass@postgres:5432/monitor_db
      ENVIRONMENT: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - monitor_network

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: monitor_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      REACT_APP_API_URL: http://localhost:8000
    networks:
      - monitor_network

  # Redis para caché y WebSockets
  redis:
    image: redis:7-alpine
    container_name: monitor_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - monitor_network

volumes:
  postgres_data:
  redis_data:

networks:
  monitor_network:
    driver: bridge